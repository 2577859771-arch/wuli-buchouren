<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光的折射与全反射 · 物理实验 3D</title>
<link rel="stylesheet" href="../lib/lab.css">
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c" class="view" aria-label="光的折射与全反射三维场景，可拖动旋转、滚轮缩放"></canvas>
    <div class="title">
      <a href="../index.html">返回实验列表</a>
      <h1>光的折射与全反射</h1>
      <p>半圆形玻璃砖与光学圆盘</p>
      <span class="engine ok" id="engine">矢量形式折射定律 · 菲涅耳公式</span>
    </div>
    <div class="stage-tools"><button class="chip" id="fitBtn">复位视角</button></div>
    <div class="hud">
      <span class="k"></span><span class="k">圆盘读数</span><span class="th">公式</span>
      <span class="k">入射角 <i class="v">i</i></span><span id="h-i">0</span><span class="th">—</span>
      <span class="k">折射角 <i class="v">r</i></span><span id="h-r">0</span><span class="th" id="h-rt">0</span>
      <span class="k">反射光强度</span><span id="h-R">0</span><span class="th">—</span>
    </div>
    <div class="legend">
      <div><span class="sw bar" style="background:#ff3b3b"></span>激光（粗细表示强度）</div>
      <div><span class="sw bar" style="background:var(--theory)"></span>法线</div>
    </div>
  </div>
  <aside>
    <section>
      <h2>参数</h2>
      <div class="btns" role="group" aria-label="光路方向">
        <button class="chip" id="mA" aria-pressed="true">空气射入玻璃</button>
        <button class="chip" id="mB" aria-pressed="false">玻璃射入空气</button>
      </div>
      <div class="row"><label for="i">入射角 <i class="v">i</i></label><input type="range" id="i" min="0" max="89" step="0.5" value="40"><output id="io"></output></div>
      <div class="row"><label for="n">折射率 <i class="v">n</i></label><input type="range" id="n" min="1.1" max="2.42" step="0.01" value="1.5"><output id="no"></output></div>
      <div class="btns" role="group" aria-label="材料">
        <button class="chip" data-n="1.33">水 1.33</button><button class="chip" data-n="1.5">玻璃 1.50</button><button class="chip" data-n="2.42">金刚石 2.42</button>
      </div>
      <div class="btns"><button class="primary" id="recBtn">记录一组数据</button><button id="clrBtn">清空记录</button></div>
      <div class="toggles"><label><input type="checkbox" id="tShadow">实时阴影</label></div>
    </section>
    <section>
      <h2>公式对照</h2>
      <div class="f"><div class="eq">折射定律：<i class="v">n</i>₁ sin <i class="v">θ</i>₁ = <i class="v">n</i>₂ sin <i class="v">θ</i>₂</div><div class="sub" id="f1"></div></div>
      <div class="f"><div class="eq">临界角：sin <i class="v">C</i> = 1 ⁄ <i class="v">n</i></div><div class="sub" id="f2"></div></div>
      <div class="f"><div class="eq">反射率随入射角增大（菲涅耳公式）</div><div class="sub">接近临界角时折射光迅速变暗，超过临界角后全部反射</div></div>
      <div class="tablewrap"><table class="cmp">
        <thead><tr><th>#</th><th><i class="v">i</i></th><th><i class="v">r</i></th><th>sin <i class="v">i</i> ⁄ sin <i class="v">r</i></th></tr></thead>
        <tbody id="tb"><tr><td colspan="4" class="empty">调好入射角后点击「记录一组数据」</td></tr></tbody>
      </table></div>
      <p class="note" id="avg">像在实验室里一样多记几组，平均值就是测得的折射率。</p>
    </section>
    <section>
      <h2>反射率–入射角</h2>
      <canvas class="chart" id="chart"></canvas>
      <div class="chart-legend"><span><span class="sw bar" style="background:var(--ghost)"></span>反射率（自然光）</span><span><span class="sw bar" style="background:#ff3b3b"></span>当前入射角</span></div>
    </section>
  </aside>
</div>
<script src="../lib/three.min.js"></script>
<script src="../lib/OrbitControls.js"></script>
<script src="../lib/question-runtime.js"></script>
<script src="../lib/lab.js"></script>
<script src="../lib/question-loader.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const stage = Lab.createStage($('c'));
const {scene} = stage;
$('fitBtn').addEventListener('click', () => stage.goHome());
Lab.bindShadow(stage, 'tShadow');
const DEG = Math.PI/180, RD = 3, Y = 0.12;
const P = {mode:'A', i:40, n:1.5};
Lab.applyQuestion(P);
const recs = [];
// 光学圆盘：画布纹理
const cv = document.createElement('canvas'); cv.width = cv.height = 1024; const ctx = cv.getContext('2d');
const tex = new THREE.CanvasTexture(cv);
function drawDisk(){
  const c = 512, R = 500;
  ctx.clearRect(0, 0, 1024, 1024);
  ctx.fillStyle = Lab.css('--paper'); ctx.beginPath(); ctx.arc(c, c, R, 0, 7); ctx.fill();
  ctx.strokeStyle = Lab.css('--ink-2'); ctx.fillStyle = Lab.css('--ink-2'); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(c, c, R - 2, 0, 7); ctx.stroke();
  ctx.font = '500 26px "Noto Sans SC",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let d = 0; d < 360; d++){
    // 0° 沿法线（画布上下方向），角度从法线量起
    const a = d*DEG, len = d % 10 === 0 ? 34 : d % 5 === 0 ? 22 : 12;
    const x = Math.sin(a), y = -Math.cos(a);
    ctx.lineWidth = d % 10 === 0 ? 2.4 : 1.2;
    ctx.beginPath(); ctx.moveTo(c + x*(R-4), c + y*(R-4)); ctx.lineTo(c + x*(R-4-len), c + y*(R-4-len)); ctx.stroke();
    if (d % 10 === 0){ const v = d <= 90 ? d : d <= 180 ? 180 - d : d <= 270 ? d - 180 : 360 - d; ctx.fillText(String(v), c + x*(R-60), c + y*(R-60)); }
  }
  ctx.setLineDash([10, 8]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(c, c - R); ctx.lineTo(c, c + R); ctx.stroke();      // 法线
  ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(c - R, c); ctx.lineTo(c + R, c); ctx.stroke(); // 界面
  tex.needsUpdate = true;
}
drawDisk(); Lab.onTheme(drawDisk);
const disk = new THREE.Mesh(new THREE.CircleGeometry(RD, 96), new THREE.MeshStandardMaterial({map:tex, roughness:0.9}));
disk.rotation.x = -Math.PI/2; disk.receiveShadow = true; scene.add(disk);
const base = new THREE.Mesh(new THREE.CylinderGeometry(RD + 0.05, RD + 0.15, 0.12, 96), Lab.std('--ink-2')); base.position.y = -0.065; scene.add(base);
Lab.floor(scene, 14, 12, -0.13);
// 半圆玻璃砖：平面在 z = 0，弧面朝向 −z
const glassShape = new THREE.Shape(); glassShape.absarc(0, 0, 1.8, 0, Math.PI, false); glassShape.lineTo(1.8, 0);
const gg = new THREE.ExtrudeGeometry(glassShape, {depth:0.26, bevelEnabled:false, curveSegments:64});
gg.rotateX(Math.PI/2); gg.translate(0, 0.26, 0);
const glass = new THREE.Mesh(gg, Lab.themed(new THREE.MeshStandardMaterial({transparent:true, opacity:0.32, roughness:0.05, metalness:0.1, depthWrite:false}), '--ghost'));
glass.scale.z = -1; scene.add(glass);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(gg, 30), Lab.lineMat('--ghost', {transparent:true, opacity:0.7})); edges.scale.z = -1; scene.add(edges);
const lg = Lab.label('玻璃', '--ghost', 0.22); lg.position.set(-0.3, 0.5, -1.2); scene.add(lg);
const la = Lab.label('空气', '--ink-2', 0.22); la.position.set(-0.3, 0.5, 1.3); scene.add(la);
// 激光器与光线
const laserBox = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.6), Lab.std('--ink', {roughness:0.4})); scene.add(laserBox);
const RED = 0xff3b3b;
const inc = Lab.beam(RED, 0.022), refl = Lab.beam(RED, 0.022), refr = Lab.beam(RED, 0.022), out = Lab.beam(RED, 0.022);
scene.add(inc, refl, refr, out);
const spot = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), new THREE.MeshBasicMaterial({color:0xffd0d0})); spot.position.set(0, Y, 0); scene.add(spot);
const chart = Lab.Chart($('chart'), {xLabel:'i / °', xMax:90, yRange:[0, 1.05], series:[{color:'--ghost'}, {color:'--warn', width:2}]});
stage.setHome(new THREE.Vector3(0, 0, 0), new THREE.Vector3(2.2, 5.4, 5.0));
stage.overheadLight(0, 0, 4, 1);
stage.renderer.shadowMap.enabled = false;

function fresnel(n1, n2, ci){
  const s = n1/n2*Math.sqrt(Math.max(0, 1 - ci*ci));
  if (s >= 1) return 1;
  const ct = Math.sqrt(1 - s*s);
  const rs = ((n1*ci - n2*ct)/(n1*ci + n2*ct))**2, rp = ((n1*ct - n2*ci)/(n1*ct + n2*ci))**2;
  return (rs + rp)/2;
}
// 矢量折射：d 为入射单位向量，nrm 为指向入射一侧的单位法线
function refract(d, nrm, eta){
  const ci = -nrm.dot(d), k = 1 - eta*eta*(1 - ci*ci);
  if (k < 0) return null;
  return d.clone().multiplyScalar(eta).add(nrm.clone().multiplyScalar(eta*ci - Math.sqrt(k))).normalize();
}
function setW(m, I){ m.material.opacity = Math.max(0.08, Math.min(1, 0.25 + I)); m.scale.x = m.scale.z = 0.35 + 0.9*Math.sqrt(I); }
let cur = {};
function update(){
  const i = P.i*DEG, A = P.mode === 'A', side = A ? 1 : -1;   // 入射光所在一侧：A 在 +z（空气），B 在 −z（玻璃）
  const n1 = A ? 1 : P.n, n2 = A ? P.n : 1;
  const src = new THREE.Vector3(-Math.sin(i)*2.8, Y, side*Math.cos(i)*2.8), O = new THREE.Vector3(0, Y, 0);
  const d = O.clone().sub(src).normalize(), nrm = new THREE.Vector3(0, 0, side);
  inc.setEnds(src, O);
  laserBox.position.copy(src).addScaledVector(d, -0.32); laserBox.lookAt(O);
  const R = fresnel(n1, n2, Math.cos(i));
  const rd = d.clone().sub(nrm.clone().multiplyScalar(2*d.dot(nrm)));
  refl.setEnds(O, O.clone().addScaledVector(rd, 2.8)); setW(refl, R);
  const t = refract(d, nrm, n1/n2);
  let rMeas = null;
  if (t){
    const end = O.clone().addScaledVector(t, 2.8); refr.setEnds(O, end); refr.visible = true; setW(refr, 1 - R);
    // 从圆盘刻度读出折射角：出射点相对法线的角度
    rMeas = Math.atan2(Math.abs(end.x), Math.abs(end.z))/DEG;
  } else refr.visible = false;
  setW(inc, 1);
  // 模式 A 的折射光、模式 B 的反射光穿过弧面：沿半径方向，不偏折
  out.visible = false;
  const rT = Math.asin(Math.min(1, n1/n2*Math.sin(i)))/DEG, tir = n1/n2*Math.sin(i) > 1;
  cur = {i:P.i, r:rMeas, tir};
  Lab.text('h-i', P.i.toFixed(1)+'°'); Lab.text('h-r', rMeas === null ? '全反射' : rMeas.toFixed(2)+'°');
  Lab.text('h-rt', tir ? '全反射' : rT.toFixed(2)+'°'); Lab.text('h-R', (R*100).toFixed(1)+'%');
  const C = Math.asin(1/P.n)/DEG;
  Lab.text('f1', A ? `1 × sin ${P.i}° = ${P.n} × sin r ⇒ r = ${rT.toFixed(2)}°` : (tir ? `${P.n} × sin ${P.i}° = ${(P.n*Math.sin(i)).toFixed(3)} > 1，无折射光` : `${P.n} × sin ${P.i}° = 1 × sin r ⇒ r = ${rT.toFixed(2)}°`));
  Lab.text('f2', `C = arcsin(1/${P.n}) = ${C.toFixed(2)}°；${A ? '光从空气射入玻璃不会发生全反射' : (tir ? '当前入射角已超过临界角' : '当前入射角小于临界角')}`);
  chart.clear();
  for (let a = 0; a <= 90; a += 0.5) chart.push(0, a, fresnel(n1, n2, Math.cos(a*DEG)));
  chart.push(1, P.i, 0); chart.push(1, P.i, 1.05); chart.draw();
}
function setMode(m){ P.mode = m; $('mA').setAttribute('aria-pressed', m === 'A'); $('mB').setAttribute('aria-pressed', m === 'B'); recs.length = 0; drawRecs(); update(); }
$('mA').addEventListener('click', () => setMode('A')); $('mB').addEventListener('click', () => setMode('B'));
function drawRecs(){
  const tb = $('tb');
  if (!recs.length){ tb.innerHTML = '<tr><td colspan="4" class="empty">调好入射角后点击「记录一组数据」</td></tr>'; Lab.text('avg', '像在实验室里一样多记几组，平均值就是测得的折射率。'); return; }
  tb.innerHTML = recs.map((r, k) => `<tr><td>${k+1}</td><td>${r.i.toFixed(1)}°</td><td>${r.r === null ? '全反射' : r.r.toFixed(2)+'°'}</td><td>${r.q === null ? '—' : r.q.toFixed(4)}</td></tr>`).join('');
  const qs = recs.filter(r => r.q !== null).map(r => r.q);
  if (qs.length){
    const m = qs.reduce((a,b) => a+b, 0)/qs.length, nT = P.mode === 'A' ? P.n : 1/P.n;
    Lab.text('avg', `${qs.length} 组平均 sin i / sin r = ${m.toFixed(4)}；${P.mode === 'A' ? '即玻璃折射率' : '即 1/n'}，理论值 ${nT.toFixed(4)}，相对误差 ${Lab.relErr(nT, m)}。`);
  }
}
$('recBtn').addEventListener('click', () => {
  const q = cur.r === null || cur.i === 0 ? null : Math.sin(cur.i*DEG)/Math.sin(cur.r*DEG);
  recs.push({i:cur.i, r:cur.r, q}); drawRecs();
});
$('clrBtn').addEventListener('click', () => { recs.length = 0; drawRecs(); });
Lab.range('i', v => v.toFixed(1)+'°', v => { P.i = v; update(); });
const nR = Lab.range('n', v => v.toFixed(2), v => { P.n = v; recs.length = 0; drawRecs(); update(); });
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => nR.set(+b.dataset.n)));
P.i = +$('i').value; P.n = +$('n').value;
update();
})();
</script>
</body>
</html>
